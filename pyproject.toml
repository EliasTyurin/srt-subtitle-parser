[project]
name = "srt-subtitle-parser"
version = "0.1.0"
description = "Parses and serializes SubRip subtitle files into structured records with start, end, and text fields."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
